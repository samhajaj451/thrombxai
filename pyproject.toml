[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thrombxai"
version = "0.1.0"
description = "Explainable temporal-spatial attention for wearable thrombotic-event early warning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.10",
    "pytest>=8.0",
    "scikit-learn>=1.3",
]

[project.scripts]
thrombxai-weave = "thrombxai.floor.weave:main"
thrombxai-audit = "thrombxai.floor.audit:main"
thrombxai-pick = "thrombxai.floor.pick:main"
thrombxai-bale-out = "thrombxai.floor.bale_out:main"
thrombxai-ship = "thrombxai.floor.ship:main"

[tool.setuptools.packages.find]
include = ["thrombxai*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["thrombxai"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["thrombxai"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["thrombxai"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
